<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Landing Page</title>

    <link rel="stylesheet" href="style_structure.css">
    <link rel="stylesheet" href="style_styling.css">
    <link rel="stylesheet" href="media_queries.css">
    <link rel="icon" type="image/x-icon" href="./assets/otta_favicon.svg">

</head>

  <body>

    <header class="grid-12-col">
        <a href="./index.html" id="logo-container">
            <img src="./assets/otta_horizontal.svg"  alt="Logo" id="logo"/>
        </a>

        <div id="nav-mobile">

            <a href="./projects.html" class="nav-element-mobile">
                <h4>Projects</h4>
            </a>

            <a href="./about.html" class="nav-element-mobile">
                <h4>About</h4>
            </a>

            <a href="./contact.html" class="nav-element-mobile">
                <h4>Contact</h4>
            </a>

        </div>
        
        
        <div class="nav-element-desktop" id="nav-element-projects">
            <a href="./projects.html">
                <h4>Projects</h4>
            </a>
        </div>
            
        <div class="nav-element-desktop" id="nav-element-about">
            <a href="./about.html">
                <h4>About</h4>
            </a>
        </div>
            
        <div class="nav-element-desktop" id="nav-element-contact">
            <a href="#./contact.html">
                <button>
                    <h4>Contact</h4>
                </button>
            </a>
        </div>
            
    </header>

    <section id="contact-section" class="grid-24-col">
        
        <h2 class="full-span-24-col">Connect</h2>
        <div class="half-span-24-col">
            
            <p>Fill in the contact form to get in touch for work or other opportunities.</p>
            <!--
                <div id="social-icons-wrapper">
                <img id="social-icon" src="twitter.svg" />
                <img id="social-icon" src="linkedin-in.svg" />
            </div>

            -->

        </div>

        <div id="contact-form" class="half-span-24-col-right">
            <h3>Send a message</h3>

            <form action="" method="get" class="form-example">
                
                <div class="form-input-field">
                <label for="name">Name: </label><br>
                <input type="text" name="name" id="name" required>
                </div>

                <div class="form-input-field">
                <label for="email">E-mail: </label><br>
                <input type="email" name="email" id="email" required>
                </div>

                <div class="form-input-field">
                    <label for="phone">Phone: </label><br>
                    <input type="phone" name="phone" id="phone">
                </div>

                <div class="form-input-field">
                    <label for="URL">Website URL: </label><br>
                    <input type="URL" name="URL" id="URL">
                </div>

                <div class="form-input-field">
                    <label for="subject">Subject: </label><br>
                    <input type="subject" name="subject" id="subject" required>
                </div>

                <div class="form-input-field">
                    <label for="message">Message: </label><br>
                    <textarea name="message" id="message" rows="5" required ></textarea>
                </div>

                <div class="form-button">
                    <button id="form-button" type="submit">Send message</button>
                </div>

            </form>
        </div>

    </section>

    <footer class="grid-12-col">
        <div class="full-span-12-col"><p>&#169; 2023 Otta</p></div>
    </footer>

  </body>
