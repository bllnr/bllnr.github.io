<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Continued Reporting</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-4 md:p-8 flex justify-center items-start min-h-screen">

  <div class="w-full bg-white rounded-lg shadow-sm border border-slate-200">
    
    <div class="px-8 py-4 rounded-t-lg bg-brandPurple">
      <h2 class="text-2xl font-semibold">Continued Reporting</h2>
    </div>

    <form id="continuedForm" class="p-8" onsubmit="return false;">
      <div class="grid grid-cols-1 xl:grid-cols-2 gap-8">
        
        <div class="space-y-4">
          <div class="grid grid-cols-4 gap-4 items-center">
            <label class="text-sm font-normal text-black text-right pr-2">Number</label>
            <div id="display-number" class="col-span-2 h-10 p-2 bg-gray-100 border border-gray-300 text-sm flex items-center text-gray-700"></div>
            <div></div>
          </div>

          <div class="grid grid-cols-4 gap-4 items-center">
            <label for="safety-area" class="text-sm font-normal text-black text-right pr-2">
              <span class="text-red-500">*</span> Area
            </label>
            <div class="col-span-2">
              <select id="safety-area" class="w-full h-10 rounded-none border border-gray-300 bg-white px-3 py-2 text-sm shadow-sm focus:outline-none transition-colors">
                <option value="" default>-- Select Safety Area --</option>
                <option value="Environmental Safety">Environmental Safety</option>
                <option value="Fire Safety">Fire Safety</option>
                <option value="Health & Safety">Health & Safety</option>
              </select>
              
              <div id="prediction-block" class="text-xs mt-1 flex items-center gap-1 hidden">
                <button id="prediction-info" type="button" class="w-3 h-3 bg-gray-300 rounded-full hover:bg-gray-400 flex items-center justify-center text-gray-600 text-[10px] font-bold transition-colors">
                  i
                </button>
                <span id="prediction-hint" class="text-gray-600">hello</span>
              </div>
              <div id="prediction-error" class="text-xs text-red-600 mt-1 hidden"></div>
            </div>
            <div></div>
          </div>
        </div>

        <div class="space-y-4">
          <div class="grid grid-cols-4 gap-4 items-center">
            <label class="text-sm font-normal text-black text-right pr-2">Reported by</label>
            <div id="display-reportedBy" class="col-span-2 h-10 p-2 bg-gray-100 border border-gray-300 text-sm flex items-center text-gray-700"></div>
          </div>

          <div class="grid grid-cols-4 gap-4 items-center">
            <label class="text-sm font-normal text-black text-right pr-2">Choose your team</label>
            <div id="display-chooseTeam" class="col-span-2 h-10 p-2 bg-gray-100 border border-gray-300 text-sm flex items-center text-gray-700"></div>
            <div></div>
          </div>

          <div class="grid grid-cols-4 gap-4 items-center">
            <label class="text-sm font-normal text-black text-right pr-2">Unit</label>
            <div id="display-unit" class="col-span-2 h-10 p-2 bg-gray-100 border border-gray-300 text-sm flex items-center text-gray-700"></div>
          </div>

          <div class="grid grid-cols-4 gap-4 items-center">
            <label class="text-sm font-normal text-black text-right pr-2">Risk</label>
            <div id="display-risk" class="col-span-2 h-10 p-2 bg-gray-100 border border-gray-300 text-sm flex items-center text-gray-700"></div>
            <div></div>
          </div>

          <div class="grid grid-cols-4 gap-4 items-center">
            <label class="text-sm font-normal text-black text-right pr-2">Risk Score</label>
            <div id="display-riskScore" class="col-span-2 h-10 p-2 bg-gray-100 border border-gray-300 text-sm flex items-center text-gray-700"></div>
            <div></div>
          </div>

          <div class="grid grid-cols-4 gap-4 items-center">
            <label for="reassignOwner" class="text-sm font-normal text-black text-right pr-2">Reassign owner of Ticket</label>
            <div class="col-span-2 flex items-stretch">
              <input
                id="reassignOwner"
                type="text"
                class="flex-1 p-2 border border-gray-300 text-sm bg-white h-10 focus:outline-none focus:ring-1 focus:ring-slate-400"
                placeholder=""
              />
              <button type="button" class="w-10 h-10 bg-gray-200 border border-l-0 border-gray-300 hover:bg-gray-300 flex items-center justify-center">
                <svg class="w-5 h-5 text-gray-600" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="1
