<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Safety Classification System Demo</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body
        class="bg-slate-100 min-h-screen flex items-center justify-center p-6"
    >
        <div
            id="demoModal"
            class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4"
        >
            <div
                class="bg-white rounded-xl shadow-2xl w-[95vw] max-w-[95vw] max-h-[90vh] flex flex-col overflow-hidden relative"
            >
                <button
                    id="closeModalBtn"
                    class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-2xl font-bold font-sans"
                >
                    &times;
                </button>

                <div class="p-6 pb-4 border-b border-gray-100">
                    <h2 class="text-2xl font-bold text-gray-900">
                        Interactive Demo - Safety Classification System
                    </h2>
                </div>

                <div class="px-6 mt-4">
                    <div
                        class="grid w-full grid-cols-2 bg-slate-100 p-1 rounded-lg"
                    >
                        <button
                            id="tabTriggerInitial"
                            class="py-2 text-sm font-medium rounded-md transition-all bg-white text-gray-900 shadow-sm"
                        >
                            Initial
                        </button>
                        <button
                            id="tabTriggerContinued"
                            class="py-2 text-sm font-medium rounded-md transition-all text-gray-500 hover:text-gray-900"
                        >
                            Continued
                        </button>
                    </div>
                </div>

                <div id="main-content" class="flex-1 overflow-y-auto p-6">
                    <div id="tabContentInitial" class="block">
                        <div
                            class="bg-gray-50 p-6 rounded-lg border border-dashed border-gray-200 text-center text-gray-500"
                        ></div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
