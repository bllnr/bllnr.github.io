<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Landing Page</title>
    
    <link rel="stylesheet" href="style_structure.css">
    <link rel="stylesheet" href="style_styling.css">
    <link rel="stylesheet" href="media_queries.css">
    <link rel="stylesheet" href="colorTheme.css">
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
  />
  <link rel="icon" type="image/x-icon" href="./assets/otta_favicon.svg">
  
  </head>
  <body>

    

    <header class="grid-12-col">
        <a href="./index.html" id="logo-container">
            <img src="./assets/otta_horizontal.svg"  alt="Logo" id="logo"/>
        </a>

        <div id="nav-mobile">

            <a href="./projects.html" class="nav-element-mobile">
                <h4>Projects</h4>
            </a>

            <a href="./about.html" class="nav-element-mobile">
                <h4>About</h4>
            </a>

            <a href="./contact.html" class="nav-element-mobile">
                <h4>Contact</h4>
            </a>

        </div>
        
        
        <div class="nav-element-desktop" id="nav-element-projects">
            <a href="./projects.html">
                <h4>Projects</h4>
            </a>
        </div>
            
        <div class="nav-element-desktop" id="nav-element-about">
            <a href="./about.html">
                <h4>About</h4>
            </a>
        </div>
            
        <div class="nav-element-desktop" id="nav-element-contact">
            <a href="#./contact.html">
                <button>
                    <h4>Contact</h4>
                </button>
            </a>
        </div>
            
    </header>

    <section id="container-main" class="grid-12-col">

		<div id="container-input" class="full-span-12-col">

			<form id="container-colorWell">
				<label for="color-mode">Change your base color!</label><br>
				<input type="color" id="colorWell" value="#a2dedd">
			</form>

            <button id="randomColor">Random color!</button>

			<form id="container-form">
				<!--<label for="form-check"></label>-->
				<div class="form-check form-switch">
					<input class="form-check-input" role="switch" type="checkbox" name="colorProperty" id="lightnessSwitch" value="lightness" checked>
					<label class="form-check-label" for="lightnessSwitch">Vary lightness</label>
				</div>

				<div class="form-check form-switch">
					<input class="form-check-input" role="switch" type="checkbox" name="colorProperty" id="saturationSwitch" value="saturation" checked>
					<label class="form-check-label" for="saturationSwitch">Vary saturation</label>
				</div>
			</form>

			<form id="container-form">
				<label for="form-selectHarmonyMode">Select Harmony Mode:</label><br>
				<select class="form-selectHarmonyMode" name="harmonyMode" id="harmonyMode" aria-label="Select Harmony mode">
					<option value="complementary">Complementary</option>
					<option value="doubleComplementary">Double Complementary</option>
					<option value="triadic">Triadic</option>
					<option value="triadicComplementary" selected>Triadic Complementary</option> <!--Split Complementary?-->
					<option value="tetradic">Tetradic</option>
					<option value="analogous">Analogous</option>
					<option value="neutral">Neutral</option>
				</select>
			</form>

		</div>

        <div id="container-swatches" class="full-span-12-col">

        </div>
		
	</section>


    

    

    

    

    <footer class="grid-12-col">
        <div class="full-span-12-col"><p>&#169; 2023 Otta</p></div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.3.0/chroma.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="colorTheme.js" ></script>

	
  </body>
</html>
